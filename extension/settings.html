<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BO Console 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>BO Console 设置</h1>
    <form id="settings-form">
      <fieldset>
        <legend>基本设置</legend>
        <label>页面标题 <input id="title" required></label>
        <label>问候名称 <input id="greeting-name"></label>
        <label>搜索模板 <input id="search-engine" required placeholder="https://www.google.com/search?q=%s"></label>
      </fieldset>

      <fieldset>
        <legend>关注端口</legend>
        <div class="port-input-row">
          <input id="watched-port" type="number" min="1" max="65535" placeholder="端口号">
          <button id="add-watched-port" type="button">添加端口</button>
        </div>
        <div id="watched-port-list" class="tag-list"></div>
        <p class="hint">留空显示所有 TCP 监听端口；添加后只显示关注端口</p>
      </fieldset>

      <fieldset>
        <legend>哪吒监控</legend>
        <label>哪吒地址 <input id="nezha-base-url" type="url" placeholder="https://nezha.example.com"></label>
      </fieldset>

      <fieldset>
        <legend>阈值设置</legend>
        <label>警告阈值 (%) <input id="warning-threshold" type="number" min="1" max="99"></label>
        <label>严重阈值 (%) <input id="critical-threshold" type="number" min="2" max="100"></label>
      </fieldset>

      <fieldset>
        <legend>刷新间隔</legend>
        <label>本机刷新秒数 <input id="local-refresh" type="number" min="5" max="300"></label>
        <label>服务器刷新秒数 <input id="remote-refresh" type="number" min="10" max="600"></label>
        <label>每页端口数 <input id="ports-per-page" type="number" min="5" max="100"></label>
      </fieldset>

      <fieldset>
        <legend>快捷入口</legend>
        <div id="shortcut-list" aria-label="快捷入口"></div>
        <button id="add-shortcut" type="button">添加快捷入口</button>
      </fieldset>

      <div class="actions">
        <button id="test-helper" type="button">测试 Helper 连接</button>
        <button id="save-settings" type="submit">保存</button>
      </div>
      <div id="status-message" role="status"></div>
    </form>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
